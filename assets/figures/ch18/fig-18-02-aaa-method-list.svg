<text x="310.0" y="383.4" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">username netadmin secret …</text>
<line x1="28" y1="445" x2="1132" y2="445" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="467" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Only an unreachable/timed-out server (ERROR) falls back to local accounts. A reject (FAIL) ends the attempt —</text>
<text x="28" y="486" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">so someone removed from the AAA server cannot get in with an old local password.</text>
<text x="1136" y="494" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
