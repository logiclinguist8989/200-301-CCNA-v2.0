<text x="554.0" y="587.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<line x1="28" y1="661" x2="1132" y2="661" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="683" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">RADIUS (UDP 1812/1813) combines authentication and authorization and encrypts only the password.</text>
<text x="28" y="702" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">TACACS+ separates the three A&#x27;s, so per-command authorization is possible.</text>
