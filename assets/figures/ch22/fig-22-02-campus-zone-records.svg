<text x="28" y="621" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">CNAME, MX and NS return NAMES, so the client must look those up again; only A, AAAA and PTR end the chain.</text>
<text x="28" y="640" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">MX must point to a host name with an A/AAAA record — never to an IP address or a CNAME.</text>
