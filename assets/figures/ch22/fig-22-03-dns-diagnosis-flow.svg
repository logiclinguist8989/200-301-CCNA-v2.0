<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 829" width="1100" height="829" role="img" aria-labelledby="t d" xml:space="preserve" style="white-space:pre">
<title id="t">Figure 22.3 — DNS diagnosis flow — separate DNS from reachability first</title>
<desc id="d">Works by IP but not by name → a name problem; fails by IP too → DNS is not the cause</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f2540" flood-opacity="0.10"/></filter>
<linearGradient id="gRouter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8fd8"/><stop offset="1" stop-color="#0b5a9c"/></linearGradient>
<linearGradient id="gRouterTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f2"/><stop offset="1" stop-color="#3a9be0"/></linearGradient>
<linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7fcc"/><stop offset="1" stop-color="#0b4f8a"/></linearGradient>
<linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd0f7"/><stop offset="1" stop-color="#46a6e6"/></linearGradient>
<linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f8a"/><stop offset="1" stop-color="#083a66"/></linearGradient>
<linearGradient id="gScreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb4ef"/><stop offset="1" stop-color="#0b6fb8"/></linearGradient>
<linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#c9d3df"/></linearGradient>
<linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a5e"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
<linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe7f5"/></linearGradient>
<linearGradient id="gFire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2574c"/><stop offset="1" stop-color="#a8261d"/></linearGradient>
<linearGradient id="gHeader" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b3b66"/><stop offset="1" stop-color="#049fd9"/></linearGradient>
<marker id="m0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1099" height="828" rx="14" fill="#ffffff" stroke="#dbe3ec"/>
<rect x="0.5" y="0.5" width="1099" height="6" rx="3" fill="url(#gHeader)"/>
<rect x="28" y="24" width="70.2" height="22" rx="11" fill="#0b3b66"/>
<text x="63.1" y="39" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">FIG 22.3</text>
<text x="110.2" y="41" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2540">DNS diagnosis flow — separate DNS from reachability first</text>
<text x="28" y="70" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5b6b7f">Works by IP but not by name → a name problem; fails by IP too → DNS is not the cause</text>
<rect x="60.0" y="106.0" width="380.0" height="64.0" rx="10" fill="#0b3b66" stroke="#0b3b66" stroke-width="1.5" filter="url(#shadow)"/>
<text x="76.0" y="132.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#ffffff" text-anchor="start">Service fails by name</text>
<text x="76.0" y="153.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">user: “the website is down”</text>
<line x1="250.0" y1="170.0" x2="250.0" y2="200.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<polygon points="250.0,200.0 415.0,246 250.0,292.0 85.0,246" fill="#fdf1df" stroke="#d9861a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="250.0" y="250.7" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">Does it fail by IP address too?</text>
<line x1="415.0" y1="246.0" x2="524.0" y2="246.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="472.5" y="236.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d9861a" text-anchor="middle">yes</text>
<rect x="530.0" y="214.0" width="530.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="546.0" y="248.9" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">Not DNS — troubleshoot reachability (Chapters 10–21)</text>
<text x="262.0" y="310.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">no</text>
<line x1="250.0" y1="292.0" x2="250.0" y2="324.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<polygon points="250.0,324.0 415.0,370 250.0,416.0 85.0,370" fill="#fdf1df" stroke="#d9861a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="250.0" y="374.7" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">Client has no / wrong DNS server?</text>
<line x1="415.0" y1="370.0" x2="524.0" y2="370.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="472.5" y="360.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d9861a" text-anchor="middle">yes</text>
<rect x="530.0" y="338.0" width="530.0" height="64.0" rx="10" fill="#fdf1df" stroke="#d9861a" stroke-width="1.5" filter="url(#shadow)"/>
<text x="546.0" y="372.9" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">ipconfig /all → fix the DHCP dns-server or static setting</text>
<text x="262.0" y="434.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">no</text>
<line x1="250.0" y1="416.0" x2="250.0" y2="448.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<polygon points="250.0,448.0 415.0,494 250.0,540.0 85.0,494" fill="#fdf1df" stroke="#d9861a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="250.0" y="498.7" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">NXDOMAIN or empty answer?</text>
<line x1="415.0" y1="494.0" x2="524.0" y2="494.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="472.5" y="484.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d9861a" text-anchor="middle">yes</text>
<rect x="530.0" y="462.0" width="530.0" height="64.0" rx="10" fill="#fde8e8" stroke="#d64040" stroke-width="1.5" filter="url(#shadow)"/>
<text x="546.0" y="487.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">Missing record or wrong name/suffix — add or fix the A/AAAA/CNAME</text>
<text x="546.0" y="506.4" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">target</text>
<text x="262.0" y="558.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">no</text>
<line x1="250.0" y1="540.0" x2="250.0" y2="572.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<polygon points="250.0,572.0 415.0,618 250.0,664.0 85.0,618" fill="#fdf1df" stroke="#d9861a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="250.0" y="622.7" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">Answer returned but wrong data?</text>
<line x1="415.0" y1="618.0" x2="524.0" y2="618.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="472.5" y="608.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d9861a" text-anchor="middle">yes</text>
<rect x="530.0" y="586.0" width="530.0" height="64.0" rx="10" fill="#efeafd" stroke="#7357d1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="546.0" y="620.9" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">Old address, wrong AAAA, MX → CNAME, stale cache (TTL) — fix and flush</text>
<text x="262.0" y="682.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">no</text>
<line x1="250.0" y1="664.0" x2="250.0" y2="682.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="60.0" y="684.0" width="380.0" height="64.0" rx="10" fill="#e4f6ec" stroke="#1f9d63" stroke-width="2" filter="url(#shadow)"/>
<text x="76.0" y="710.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#0f2540" text-anchor="start">SERVFAIL or timeout?</text>
<text x="76.0" y="731.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">Resolver can&#x27;t reach / lame delegation (NS)</text>
<line x1="28" y1="789" x2="1072" y2="789" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="811" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Tools: nslookup &lt;name&gt; [server] · dig &lt;name&gt; &lt;type&gt; [@server] · Resolve-DnsName · ipconfig /displaydns and /flushdns.</text>
<text x="1076" y="819" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
</svg>
