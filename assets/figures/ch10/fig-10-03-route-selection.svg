<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 581" width="1160" height="581" role="img" aria-labelledby="t d" xml:space="preserve" style="white-space:pre">
<title id="t">Figure 10.3 — Route selection: two separate jobs</title>
<desc id="d">AD and metric decide what is installed for each prefix; longest match decides which installed route a packet uses</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f2540" flood-opacity="0.10"/></filter>
<linearGradient id="gRouter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8fd8"/><stop offset="1" stop-color="#0b5a9c"/></linearGradient>
<linearGradient id="gRouterTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f2"/><stop offset="1" stop-color="#3a9be0"/></linearGradient>
<linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7fcc"/><stop offset="1" stop-color="#0b4f8a"/></linearGradient>
<linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd0f7"/><stop offset="1" stop-color="#46a6e6"/></linearGradient>
<linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f8a"/><stop offset="1" stop-color="#083a66"/></linearGradient>
<linearGradient id="gScreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb4ef"/><stop offset="1" stop-color="#0b6fb8"/></linearGradient>
<linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#c9d3df"/></linearGradient>
<linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a5e"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
<linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe7f5"/></linearGradient>
<linearGradient id="gFire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2574c"/><stop offset="1" stop-color="#a8261d"/></linearGradient>
<linearGradient id="gHeader" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b3b66"/><stop offset="1" stop-color="#049fd9"/></linearGradient>
<marker id="m0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1159" height="580" rx="14" fill="#ffffff" stroke="#dbe3ec"/>
<rect x="0.5" y="0.5" width="1159" height="6" rx="3" fill="url(#gHeader)"/>
<rect x="28" y="24" width="70.2" height="22" rx="11" fill="#0b3b66"/>
<text x="63.1" y="39" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">FIG 10.3</text>
<text x="110.2" y="41" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2540">Route selection: two separate jobs</text>
<text x="28" y="70" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5b6b7f">AD and metric decide what is installed for each prefix; longest match decides which installed route a packet uses</text>
<rect x="40.0" y="100.0" width="520.0" height="400.0" rx="14" fill="#efeafd" stroke="#7357d1" stroke-width="1.5"/>
<text x="300.0" y="130.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#3e2a85" text-anchor="middle">Building the table (control plane)</text>
<text x="300.0" y="150.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5b6b7f" text-anchor="middle">runs when routing information changes</text>
<rect x="70.0" y="170.0" width="460.0" height="70.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="86.0" y="196.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f2540" text-anchor="start">Candidates for the SAME prefix 10.10.40.0/24</text>
<text x="86.0" y="214.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">static AD 1 · OSPF AD 110 · RIP AD 120</text>
<line x1="300.0" y1="240.0" x2="300.0" y2="266.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="70.0" y="270.0" width="460.0" height="70.0" rx="10" fill="#fdf1df" stroke="#d9861a" stroke-width="1.5" filter="url(#shadow)"/>
<text x="86.0" y="298.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="650" fill="#0f2540" text-anchor="start" xml:space="preserve">1  Lowest administrative distance</text>
<text x="86.0" y="320.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">picks the source (most trusted)</text>
<line x1="300.0" y1="340.0" x2="300.0" y2="366.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="70.0" y="370.0" width="460.0" height="70.0" rx="10" fill="#fdf1df" stroke="#d9861a" stroke-width="1.5" filter="url(#shadow)"/>
<text x="86.0" y="398.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="650" fill="#0f2540" text-anchor="start" xml:space="preserve">2  Lowest metric</text>
<text x="86.0" y="420.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">within that protocol; equal metrics → ECMP</text>
<text x="300.0" y="474.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#3e2a85" text-anchor="middle">→ installed in the routing table</text>
<rect x="600.0" y="100.0" width="520.0" height="400.0" rx="14" fill="#e7f0fc" stroke="#1d6fd1" stroke-width="1.5"/>
<text x="860.0" y="130.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f3f80" text-anchor="middle">Forwarding a packet (data plane)</text>
<text x="860.0" y="150.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5b6b7f" text-anchor="middle">runs for every packet</text>
<rect x="630.0" y="170.0" width="460.0" height="70.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="646.0" y="196.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f2540" text-anchor="start">Packet to 10.10.40.25</text>
<text x="646.0" y="214.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">compare against installed routes only</text>
<line x1="860.0" y1="240.0" x2="860.0" y2="266.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="630.0" y="270.0" width="460.0" height="70.0" rx="10" fill="#e7f0fc" stroke="#1d6fd1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="646.0" y="298.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="650" fill="#0f2540" text-anchor="start" xml:space="preserve">3  Longest prefix match</text>
<text x="646.0" y="320.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">the most specific route that contains the address</text>
<line x1="860.0" y1="340.0" x2="860.0" y2="366.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="630.0" y="370.0" width="460.0" height="70.0" rx="10" fill="#e4f6ec" stroke="#1f9d63" stroke-width="1.5" filter="url(#shadow)"/>
<text x="646.0" y="396.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f3f80" text-anchor="start">10.10.40.0/24 wins over 10.10.0.0/16</text>
<text x="646.0" y="414.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">AD is not consulted here</text>
<line x1="562.0" y1="300.0" x2="598.0" y2="300.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#m0)"/>
<line x1="28" y1="541" x2="1132" y2="541" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="563" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">AD and metric never compete across different prefixes: a static /16 (AD 1) does not beat an OSPF /24 (AD 110) for 10.10.40.25.</text>
<text x="1136" y="571" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
</svg>
