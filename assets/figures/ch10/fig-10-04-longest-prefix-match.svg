<text x="28" y="499" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Length alone is never enough: the /30 is longest of all but does not contain 10.10.40.25.</text>
