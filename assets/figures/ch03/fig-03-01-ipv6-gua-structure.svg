<text x="28" y="402" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">The provider assigns the /48; you design the 16-bit subnet ID (here VLAN 10); the host forms the 64-bit interface ID (EUI-64 in Figure 3.2).</text>
