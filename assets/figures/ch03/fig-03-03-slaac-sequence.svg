<text x="28" y="682" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Steps 1 and 4 happen inside PC1. No DHCP server is involved. The gateway is R1&#x27;s link-local address fe80::1.</text>
