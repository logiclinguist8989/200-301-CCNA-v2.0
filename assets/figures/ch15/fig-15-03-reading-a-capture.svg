<rect x="0.5" y="0.5" width="1159" height="550" rx="14" fill="#ffffff" stroke="#dbe3ec"/>
<rect x="0.5" y="0.5" width="1159" height="6" rx="3" fill="url(#gHeader)"/>
<rect x="28" y="24" width="70.2" height="22" rx="11" fill="#0b3b66"/>
<text x="63.1" y="39" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">FIG 15.3</text>
<text x="110.2" y="41" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2540">Reading the capture: four conversations and what each proves</text>
<text x="28" y="70" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5b6b7f">Group frames by conversation, then ask what each one proves about the path</text>
<rect x="40.0" y="110.0" width="530.0" height="170.0" rx="12" fill="#e4f6ec" stroke="#1f9d63" stroke-width="1.5"/>
<text x="60.0" y="142.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2540" text-anchor="start">Frames 1–2 · ARP</text>
<rect x="60.0" y="158.0" width="490.0" height="56.0" rx="6" fill="#0f172a" stroke="none" stroke-width="1.5"/>
<text x="74.0" y="180.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#e2e8f0" text-anchor="start">Who has 10.10.10.1?</text>
<text x="74.0" y="202.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#e2e8f0" text-anchor="start">→ 0000.0c9f.f00a</text>
<text x="60.0" y="250.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f5a37" text-anchor="start">Gateway resolves to the HSRP virtual MAC ✓</text>
<rect x="590.0" y="110.0" width="530.0" height="170.0" rx="12" fill="#e4f6ec" stroke="#1f9d63" stroke-width="1.5"/>
<text x="610.0" y="142.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2540" text-anchor="start">Frames 3–4 · ICMP</text>
<rect x="610.0" y="158.0" width="490.0" height="56.0" rx="6" fill="#0f172a" stroke="none" stroke-width="1.5"/>
<text x="624.0" y="180.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#e2e8f0" text-anchor="start">Echo request to 192.0.2.8</text>
<text x="624.0" y="202.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#e2e8f0" text-anchor="start">reply ttl=253</text>
<text x="610.0" y="250.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f5a37" text-anchor="start">Internet path and NAT work ✓</text>
<rect x="40.0" y="300.0" width="530.0" height="170.0" rx="12" fill="#fdf1df" stroke="#d9861a" stroke-width="2.5"/>
<text x="60.0" y="332.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2540" text-anchor="start">Frames 5–6 · TCP 9100</text>
<rect x="60.0" y="348.0" width="490.0" height="56.0" rx="6" fill="#0f172a" stroke="none" stroke-width="1.5"/>
<text x="74.0" y="370.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#e2e8f0" text-anchor="start">SYN →</text>
<text x="74.0" y="392.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#e2e8f0" text-anchor="start">← RST, ACK</text>
<text x="60.0" y="440.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#7a4708" text-anchor="start">Host reachable, port 9100 CLOSED ✗</text>
<rect x="590.0" y="300.0" width="530.0" height="170.0" rx="12" fill="#e4f6ec" stroke="#1f9d63" stroke-width="1.5"/>
<text x="610.0" y="332.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2540" text-anchor="start">Frames 7–9 · TCP 631</text>
<rect x="610.0" y="348.0" width="490.0" height="56.0" rx="6" fill="#0f172a" stroke="none" stroke-width="1.5"/>
<text x="624.0" y="370.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#e2e8f0" text-anchor="start">SYN → SYN-ACK → ACK</text>
<text x="624.0" y="392.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#e2e8f0" text-anchor="start">three-way handshake</text>
<text x="610.0" y="440.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f5a37" text-anchor="start">IPP printing service open ✓</text>
<line x1="28" y1="511" x2="1132" y2="511" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="533" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Verdict for the “cannot print” ticket: the network is fine — the printer&#x27;s raw-print service (TCP 9100) is closed; IPP (631) works.</text>
<text x="1136" y="541" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
