<text x="28" y="610" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">IOS and Linux/macOS send UDP probes (ports from 33434); Windows tracert sends ICMP Echo. Three probes per hop.</text>
<text x="28" y="629" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">* * * means no reply for that hop — often an ACL or a router that rate-limits ICMP, not necessarily a failure.</text>
