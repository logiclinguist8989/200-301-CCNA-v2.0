<text x="28" y="457" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Trust the uplinks (ip arp inspection trust) or the gateway&#x27;s ARP replies are dropped and the whole VLAN loses its gateway.</text>
