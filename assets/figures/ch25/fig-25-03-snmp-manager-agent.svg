<text x="990.0" y="284.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">MIB: sysName, ifInOctets, CPU …</text>
<line x1="270.0" y1="150.0" x2="890.0" y2="150.0" stroke="#1d6fd1" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="580.0" y="138.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1d6fd1" text-anchor="middle" xml:space="preserve">Get · GetNext · GetBulk · Set  →  UDP 161</text>
<line x1="890.0" y1="210.0" x2="270.0" y2="210.0" stroke="#1f9d63" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m1)"/>
<text x="580.0" y="200.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle">Response (value of the OID)</text>
<line x1="890.0" y1="270.0" x2="270.0" y2="270.0" stroke="#d9861a" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 5" marker-end="url(#m2)"/>
<text x="580.0" y="260.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d9861a" text-anchor="middle" xml:space="preserve">Trap / Inform  →  UDP 162 (agent starts it)</text>
<rect x="40.0" y="330.0" width="1080.0" height="62.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="56.0" y="363.9" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0f2540" text-anchor="start" xml:space="preserve">v1 / v2c: community string in clear text (RO / RW)  ·  v3: users, groups, noAuthNoPriv / authNoPriv / authPriv</text>
<line x1="28" y1="433" x2="1132" y2="433" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="455" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Traps are unacknowledged; Informs (v2c/v3) are resent until confirmed. SNMPv3 authPriv adds authentication (SHA) and encryption (AES).</text>
<text x="28" y="474" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">OIDs address values in the MIB: 1.3.6.1.2.1.1.5.0 = sysName · 1.3.6.1.2.1.2.2.1.10 = ifInOctets.</text>
<text x="1136" y="482" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
