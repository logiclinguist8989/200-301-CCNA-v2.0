<text x="28" y="70" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5b6b7f">Polling: the manager asks on UDP 161 · Notifications: the agent tells the manager on UDP 162</text>
