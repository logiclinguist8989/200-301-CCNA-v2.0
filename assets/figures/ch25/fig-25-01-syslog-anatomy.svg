<text x="786.0" y="393.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0f5a37" text-anchor="start">Configured from console by neta…</text>
<line x1="28" y1="445" x2="1132" y2="445" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="467" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">service sequence-numbers adds the seq-no · service timestamps log datetime msec localtime show-timezone sets the timestamp.</text>
<text x="28" y="486" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">SYS-5-CONFIG_I is what you search for in documentation and filters.</text>
