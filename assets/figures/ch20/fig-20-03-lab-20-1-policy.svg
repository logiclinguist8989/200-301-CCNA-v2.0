<text x="60.0" y="502.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#0f2540" text-anchor="start">permit 10.10.99.0 0.0.0.255 · permit host 10.10.10.11 (PC1, admin) · implicit deny — guards SSH to the switches themselves</text>
<line x1="28" y1="561" x2="1132" y2="561" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="583" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">WIRELESS-IN is applied inbound on interface vlan 30 on BOTH DSW1 and DSW2, so the policy survives an HSRP failover.</text>
<text x="28" y="602" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">The extended ACL sits close to the source; DHCP (UDP 67) and ping stay permitted.</text>
<text x="1136" y="610" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
