<text x="660.0" y="406.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5b6b7f" text-anchor="start">DHCP, ping, internet 192.0.2.8 …</text>
<text x="1100.0" y="384.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#0f5a37" text-anchor="end">permit ip any any</text>
