<path d="M150,190 C200,190 220,150 256,150" fill="none" stroke="#1d6fd1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m3)"/>
<text x="1040.0" y="262.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#0f5a37" text-anchor="middle">first match → stop</text>
<line x1="28" y1="545" x2="1132" y2="545" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="567" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Order matters: put specific lines before general ones. One ACL per interface, per direction, per protocol.</text>
<text x="28" y="586" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">An ACL with only deny lines blocks everything — it needs at least one permit.</text>
<text x="1136" y="594" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
