<line x1="830.0" y1="168.0" x2="1000.0" y2="168.0" stroke="#1d6fd1" stroke-width="2.2" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="915.0" y="206.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5b6b7f" text-anchor="middle">recursive lookup → ARP for 10.0.12.2</text>
<rect x="40.0" y="242.0" width="1080.0" height="116.0" rx="10" fill="#fde8e8" stroke="#d64040" stroke-width="1.5" filter="url(#shadow)"/>
<text x="60.0" y="270.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2540" text-anchor="start" xml:space="preserve">2  Exit interface only</text>
<text x="60.0" y="300.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0f2540" text-anchor="start">ip route 10.20.20.0 255.255.255.0 g0/0/1</text>
<text x="60.0" y="328.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#5b6b7f" text-anchor="start">S 10.20.20.0/24 is directly connected, G0/0/1</text>
<g transform="translate(800.0,300.0) scale(0.6)"><ellipse cx="0" cy="15.0" rx="36" ry="12" fill="#0f2540" opacity="0.12"/><path d="M-34,-13.0 L-34,13.0 A34,12 0 0 0 34,13.0 L34,-13.0 Z" fill="url(#gRouter)"/><ellipse cx="0" cy="-13.0" rx="34" ry="12" fill="url(#gRouterTop)" stroke="#0b5a9c" stroke-width="1"/><line x1="-24.0" y1="-13.0" x2="-16.2" y2="-13.0" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><polygon points="-12.0,-13.0 -16.2,-9.6 -16.2,-16.4" fill="#ffffff"/><line x1="24.0" y1="-13.0" x2="16.2" y2="-13.0" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><polygon points="12.0,-13.0 16.2,-16.4 16.2,-9.6" fill="#ffffff"/><line x1="-0.0" y1="-14.0" x2="0.0" y2="-18.8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><polygon points="0.0,-23.0 3.4,-18.8 -3.4,-18.8" fill="#ffffff"/><line x1="-0.0" y1="-12.0" x2="0.0" y2="-7.2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><polygon points="0.0,-3.0 -3.4,-7.2 3.4,-7.2" fill="#ffffff"/><line x1="-28" y1="11.0" x2="28" y2="11.0" stroke="#7cc4f2" stroke-width="0.8" opacity="0.4"/></g>
<line x1="830.0" y1="300.0" x2="1000.0" y2="300.0" stroke="#d64040" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#m1)"/>
<text x="915.0" y="338.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#d64040" text-anchor="middle">ARP for EVERY destination — needs proxy ARP</text>
<rect x="40.0" y="374.0" width="1080.0" height="116.0" rx="10" fill="#e4f6ec" stroke="#1f9d63" stroke-width="2" filter="url(#shadow)"/>
<text x="60.0" y="402.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2540" text-anchor="start" xml:space="preserve">3  Fully specified</text>
<text x="60.0" y="432.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0f2540" text-anchor="start">ip route 10.20.20.0 255.255.255.0 g0/0/1 10.0.12.2</text>
<text x="60.0" y="460.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#5b6b7f" text-anchor="start">S 10.20.20.0/24 [1/0] via 10.0.12.2, G0/0/1</text>
<g transform="translate(800.0,432.0) scale(0.6)"><ellipse cx="0" cy="15.0" rx="36" ry="12" fill="#0f2540" opacity="0.12"/><path d="M-34,-13.0 L-34,13.0 A34,12 0 0 0 34,13.0 L34,-13.0 Z" fill="url(#gRouter)"/><ellipse cx="0" cy="-13.0" rx="34" ry="12" fill="url(#gRouterTop)" stroke="#0b5a9c" stroke-width="1"/><line x1="-24.0" y1="-13.0" x2="-16.2" y2="-13.0" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><polygon points="-12.0,-13.0 -16.2,-9.6 -16.2,-16.4" fill="#ffffff"/><line x1="24.0" y1="-13.0" x2="16.2" y2="-13.0" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><polygon points="12.0,-13.0 16.2,-16.4 16.2,-9.6" fill="#ffffff"/><line x1="-0.0" y1="-14.0" x2="0.0" y2="-18.8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><polygon points="0.0,-23.0 3.4,-18.8 -3.4,-18.8" fill="#ffffff"/><line x1="-0.0" y1="-12.0" x2="0.0" y2="-7.2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><polygon points="0.0,-3.0 -3.4,-7.2 3.4,-7.2" fill="#ffffff"/><line x1="-28" y1="11.0" x2="28" y2="11.0" stroke="#7cc4f2" stroke-width="0.8" opacity="0.4"/></g>
<line x1="830.0" y1="432.0" x2="1000.0" y2="432.0" stroke="#1f9d63" stroke-width="2.2" stroke-linecap="round" marker-end="url(#m2)"/>
<text x="915.0" y="470.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5b6b7f" text-anchor="middle">no recursion; ARP only for the next hop ✓</text>
<line x1="28" y1="531" x2="1132" y2="531" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="553" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">IPv6 with a link-local next hop must be fully specified: ipv6 route 2001:db8:acad:20::/64 g0/0/1 fe80::2</text>
<text x="1136" y="561" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
