<line x1="28" y1="573" x2="1132" y2="573" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="595" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Northbound: usually a REST API with JSON over HTTPS. Southbound: NETCONF (XML over SSH, port 830), RESTCONF (HTTPS),</text>
<text x="28" y="614" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">SSH CLI, SNMP — and CAPWAP for lightweight APs. The controller keeps the desired state and translates intent into configuration.</text>
