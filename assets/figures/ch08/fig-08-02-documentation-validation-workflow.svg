<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-labelledby="t d" xml:space="preserve" style="white-space:pre">
<title id="t">Figure 8.2 — Documentation validation workflow — run once per link</title>
<desc id="d">Matches go straight to the published record; mismatches are fixed in the docs or, via change control, in the network</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f2540" flood-opacity="0.10"/></filter>
<linearGradient id="gRouter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8fd8"/><stop offset="1" stop-color="#0b5a9c"/></linearGradient>
<linearGradient id="gRouterTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f2"/><stop offset="1" stop-color="#3a9be0"/></linearGradient>
<linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7fcc"/><stop offset="1" stop-color="#0b4f8a"/></linearGradient>
<linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd0f7"/><stop offset="1" stop-color="#46a6e6"/></linearGradient>
<linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f8a"/><stop offset="1" stop-color="#083a66"/></linearGradient>
<linearGradient id="gScreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb4ef"/><stop offset="1" stop-color="#0b6fb8"/></linearGradient>
<linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#c9d3df"/></linearGradient>
<linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a5e"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
<linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe7f5"/></linearGradient>
<linearGradient id="gFire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2574c"/><stop offset="1" stop-color="#a8261d"/></linearGradient>
<linearGradient id="gHeader" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b3b66"/><stop offset="1" stop-color="#049fd9"/></linearGradient>
<marker id="m0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/></marker>
<marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#1f9d63"/></marker>
<marker id="m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#d64040"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1159" height="559" rx="14" fill="#ffffff" stroke="#dbe3ec"/>
<rect x="0.5" y="0.5" width="1159" height="6" rx="3" fill="url(#gHeader)"/>
<rect x="28" y="24" width="62.8" height="22" rx="11" fill="#0b3b66"/>
<text x="59.4" y="39" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">FIG 8.2</text>
<text x="102.8" y="41" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2540">Documentation validation workflow — run once per link</text>
<text x="28" y="70" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5b6b7f">Matches go straight to the published record; mismatches are fixed in the docs or, via change control, in the network</text>
<rect x="40.0" y="120.0" width="190.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="56.0" y="147.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#0f2540" text-anchor="start" xml:space="preserve">1  Collect docs</text>
<text x="56.0" y="168.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">drawing, port table,</text>
<text x="56.0" y="185.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">IP plan, inventory</text>
<rect x="250.0" y="120.0" width="190.0" height="100.0" rx="10" fill="#e7f0fc" stroke="#1d6fd1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="266.0" y="147.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#0f2540" text-anchor="start" xml:space="preserve">2  Gather evidence</text>
<text x="266.0" y="168.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">show cdp/lldp neighbors</text>
<text x="266.0" y="185.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">detail · show int status</text>
<rect x="460.0" y="120.0" width="190.0" height="100.0" rx="10" fill="#e7f0fc" stroke="#1d6fd1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="476.0" y="147.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#0f2540" text-anchor="start" xml:space="preserve">3  Compare per link</text>
<text x="476.0" y="168.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">hostname, local + remote</text>
<text x="476.0" y="185.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">port, model, mgmt IP</text>
<line x1="230.0" y1="170.0" x2="248.0" y2="170.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<line x1="440.0" y1="170.0" x2="458.0" y2="170.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<polygon points="800,120.0 910.0,170 800,220.0 690.0,170" fill="#fdf1df" stroke="#d9861a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="800.0" y="175.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#7a4708" text-anchor="middle">Matches?</text>
<line x1="650.0" y1="170.0" x2="688.0" y2="170.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="960.0" y="120.0" width="170.0" height="100.0" rx="10" fill="#e4f6ec" stroke="#1f9d63" stroke-width="1.5" filter="url(#shadow)"/>
<text x="976.0" y="147.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#0f2540" text-anchor="start" xml:space="preserve">6  Publish</text>
<text x="976.0" y="168.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">date + who verified;</text>
<text x="976.0" y="185.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">update descriptions</text>
<line x1="910.0" y1="170.0" x2="958.0" y2="170.0" stroke="#1f9d63" stroke-width="2" stroke-linecap="round" marker-end="url(#m1)"/>
<text x="934.0" y="160.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle">yes</text>
<line x1="800.0" y1="220.0" x2="800.0" y2="290.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="812.0" y="270.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d9861a" text-anchor="start">no</text>
<polygon points="800,290.0 950.0,340 800,390.0 650.0,340" fill="#fdf1df" stroke="#d9861a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="800.0" y="336.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle" xml:space="preserve">4  Network follows the</text>
<text x="800.0" y="353.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">approved design?</text>
<line x1="950.0" y1="340.0" x2="976.0" y2="340.0" stroke="#1f9d63" stroke-width="2" stroke-linecap="round" marker-end="url(#m1)"/>
<rect x="980.0" y="300.0" width="150.0" height="80.0" rx="10" fill="#efeafd" stroke="#7357d1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="996.0" y="327.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#0f2540" text-anchor="start">Docs wrong</text>
<text x="996.0" y="348.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">update them</text>
<line x1="1055.0" y1="300.0" x2="1055.0" y2="224.0" stroke="#1f9d63" stroke-width="2" stroke-linecap="round" marker-end="url(#m1)"/>
<text x="962.0" y="330.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#1f9d63" text-anchor="middle">yes</text>
<path d="M650.0,340.0 L428.0,340.0 Q420.0,340.0 420.0,348.0 L420.0,380.0" fill="none" stroke="#d64040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m2)"/>
<text x="520.0" y="330.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d64040" text-anchor="middle">no</text>
<rect x="290.0" y="384.0" width="260.0" height="80.0" rx="10" fill="#fde8e8" stroke="#d64040" stroke-width="1.5" filter="url(#shadow)"/>
<text x="306.0" y="411.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#0f2540" text-anchor="start">Network is wrong</text>
<text x="306.0" y="432.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">fix via change control,</text>
<text x="306.0" y="449.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">then re-check from step 2</text>
<path d="M290.0,424.0 L258.0,424.0 Q250.0,424.0 250.0,416.0 L250.0,222.0" fill="none" stroke="#d64040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#m2)"/>
<rect x="40.0" y="400.0" width="190.0" height="60.0" rx="10" fill="#e0f5f7" stroke="#0f9aa8" stroke-width="1.5" filter="url(#shadow)"/>
<text x="56.0" y="426.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#0f2540" text-anchor="start" xml:space="preserve">5  Non-CDP hosts</text>
<text x="56.0" y="447.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">MAC/ARP/DHCP tables</text>
<line x1="28" y1="520" x2="1132" y2="520" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="542" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Hosts that run neither protocol: verify with show mac address-table interface &lt;port&gt; and DHCP/ARP tables.</text>
<text x="1136" y="550" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
</svg>
