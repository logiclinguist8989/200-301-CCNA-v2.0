<text x="796.0" y="540.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f2540" text-anchor="start">PortFast + BPDU guard</text>
<text x="796.0" y="558.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#5b6b7f" text-anchor="start">on every host-facing access port</text>
<line x1="28" y1="602" x2="1132" y2="602" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="624" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">BPDU guard err-disables a host port that receives any BPDU. Root guard puts a port root-inconsistent on a superior BPDU.</text>
<text x="28" y="643" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Loop guard puts a non-designated port loop-inconsistent when BPDUs stop arriving (e.g. a unidirectional fiber).</text>
<text x="1136" y="651" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
