<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 453" width="1160" height="453" role="img" aria-labelledby="t d" xml:space="preserve" style="white-space:pre">
<title id="t">Figure 9.2 — Bridge ID: 4-bit priority + 12-bit VLAN + 48-bit MAC</title>
<desc id="d">Priorities move in steps of 4096 because the priority field sits above the 12-bit extended system ID</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f2540" flood-opacity="0.10"/></filter>
<linearGradient id="gRouter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8fd8"/><stop offset="1" stop-color="#0b5a9c"/></linearGradient>
<linearGradient id="gRouterTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f2"/><stop offset="1" stop-color="#3a9be0"/></linearGradient>
<linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7fcc"/><stop offset="1" stop-color="#0b4f8a"/></linearGradient>
<linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd0f7"/><stop offset="1" stop-color="#46a6e6"/></linearGradient>
<linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f8a"/><stop offset="1" stop-color="#083a66"/></linearGradient>
<linearGradient id="gScreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb4ef"/><stop offset="1" stop-color="#0b6fb8"/></linearGradient>
<linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#c9d3df"/></linearGradient>
<linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a5e"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
<linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe7f5"/></linearGradient>
<linearGradient id="gFire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2574c"/><stop offset="1" stop-color="#a8261d"/></linearGradient>
<linearGradient id="gHeader" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b3b66"/><stop offset="1" stop-color="#049fd9"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="1159" height="452" rx="14" fill="#ffffff" stroke="#dbe3ec"/>
<rect x="0.5" y="0.5" width="1159" height="6" rx="3" fill="url(#gHeader)"/>
<rect x="28" y="24" width="62.8" height="22" rx="11" fill="#0b3b66"/>
<text x="59.4" y="39" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">FIG 9.2</text>
<text x="102.8" y="41" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2540">Bridge ID: 4-bit priority + 12-bit VLAN + 48-bit MAC</text>
<text x="28" y="70" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5b6b7f">Priorities move in steps of 4096 because the priority field sits above the 12-bit extended system ID</text>
<rect x="60.0" y="140.0" width="180.0" height="64.0" rx="4" fill="#e7f0fc" stroke="#1d6fd1" stroke-width="1.5"/>
<text x="150.0" y="170.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0f3f80" text-anchor="middle">Priority</text>
<text x="150.0" y="187.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle">4 bits</text>
<rect x="240.0" y="140.0" width="340.0" height="64.0" rx="4" fill="#fdf1df" stroke="#d9861a" stroke-width="1.5"/>
<text x="410.0" y="170.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#7a4708" text-anchor="middle">Extended system ID (VLAN)</text>
<text x="410.0" y="187.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle">12 bits</text>
<rect x="580.0" y="140.0" width="520.0" height="64.0" rx="4" fill="#efeafd" stroke="#7357d1" stroke-width="1.5"/>
<text x="840.0" y="170.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#3e2a85" text-anchor="middle">MAC address</text>
<text x="840.0" y="187.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle">48 bits</text>
<path d="M60,222 L60,230 L580,230 L580,222" fill="none" stroke="#0f2540" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320.0" y="248.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0f2540" text-anchor="middle">Bridge priority shown by IOS (16 bits)</text>
<text x="60.0" y="300.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2540" text-anchor="start">VLAN 10 example</text>
<rect x="60.0" y="316.0" width="180.0" height="56.0" rx="4" fill="#e7f0fc" stroke="#1d6fd1" stroke-width="1.5"/>
<text x="150.0" y="342.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0f3f80" text-anchor="middle">1000</text>
<text x="150.0" y="359.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle">= 32768</text>
<rect x="240.0" y="316.0" width="340.0" height="56.0" rx="4" fill="#fdf1df" stroke="#d9861a" stroke-width="1.5"/>
<text x="410.0" y="342.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#7a4708" text-anchor="middle">0000 0000 1010</text>
<text x="410.0" y="359.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle">= 10</text>
<rect x="580.0" y="316.0" width="520.0" height="56.0" rx="4" fill="#efeafd" stroke="#7357d1" stroke-width="1.5"/>
<text x="840.0" y="342.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#3e2a85" text-anchor="middle">0011.1111.1111</text>
<text x="840.0" y="359.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="middle">switch MAC</text>
<text x="600.0" y="300.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f3f80" text-anchor="middle">32768 + 10 = 32778</text>
<line x1="28" y1="413" x2="1132" y2="413" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="435" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Lower BID wins. Priority is compared first; the MAC address breaks ties. Valid priorities: 0, 4096, 8192 … 61440.</text>
<text x="1136" y="443" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
</svg>
