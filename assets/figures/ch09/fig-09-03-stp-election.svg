<text x="28" y="523" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Every link has exactly one designated port; every non-root switch exactly one root port.</text>
<text x="28" y="542" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">SW-B Gi0/2 wins the B–C tie on lower sender BID, so SW-C Gi0/2 becomes the alternate (discarding) port.</text>
