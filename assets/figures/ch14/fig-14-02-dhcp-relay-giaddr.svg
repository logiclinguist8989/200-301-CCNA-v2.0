<line x1="28" y1="571" x2="1132" y2="571" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="593" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">The server picks the pool whose network contains giaddr, and needs a route back to the giaddr subnet.</text>
<text x="28" y="612" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Configure the helper on both HSRP switches: each relays, the server answers both, the client takes one Offer.</text>
