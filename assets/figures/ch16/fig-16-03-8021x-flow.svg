<rect x="200.0" y="655.0" width="380.0" height="10.0" rx="5" fill="#1d6fd1" stroke="none" stroke-width="1.5"/>
<text x="390.0" y="690.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d6fd1" text-anchor="middle">encrypted user traffic (AES-CCMP / GCMP)</text>
<line x1="28" y1="734" x2="1132" y2="734" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="756" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Common EAP methods: EAP-TLS (certificates both sides — strongest), PEAP (server certificate + password in a TLS tunnel), EAP-FAST.</text>
<text x="28" y="775" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">RADIUS: UDP 1812 authentication, 1813 accounting. The same server can also authenticate wired 802.1X and admins (Chapter 18).</text>
