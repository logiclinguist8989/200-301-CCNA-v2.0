<text x="28" y="466" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Adjacent-channel interference (e.g. APs on 1 and 3) corrupts frames; co-channel interference (both on 6) only makes APs take turns.</text>
<text x="28" y="485" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Use 20 MHz channels in 2.4 GHz. 1–11 in the USA; 1–13 in most other countries.</text>
