<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" role="img" aria-labelledby="t d" xml:space="preserve" style="white-space:pre">
<title id="t">Figure 27.2 — Levels of autonomy for AI agents in network operations</title>
<desc id="d">Each step to the right lets the agent do more alone — and raises the impact of a mistake</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f2540" flood-opacity="0.10"/></filter>
<linearGradient id="gRouter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8fd8"/><stop offset="1" stop-color="#0b5a9c"/></linearGradient>
<linearGradient id="gRouterTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f2"/><stop offset="1" stop-color="#3a9be0"/></linearGradient>
<linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7fcc"/><stop offset="1" stop-color="#0b4f8a"/></linearGradient>
<linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd0f7"/><stop offset="1" stop-color="#46a6e6"/></linearGradient>
<linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f8a"/><stop offset="1" stop-color="#083a66"/></linearGradient>
<linearGradient id="gScreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb4ef"/><stop offset="1" stop-color="#0b6fb8"/></linearGradient>
<linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#c9d3df"/></linearGradient>
<linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a5e"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
<linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe7f5"/></linearGradient>
<linearGradient id="gFire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2574c"/><stop offset="1" stop-color="#a8261d"/></linearGradient>
<linearGradient id="gHeader" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b3b66"/><stop offset="1" stop-color="#049fd9"/></linearGradient>
<marker id="m0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/></marker>
<marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#d9861a"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1159" height="469" rx="14" fill="#ffffff" stroke="#dbe3ec"/>
<rect x="0.5" y="0.5" width="1159" height="6" rx="3" fill="url(#gHeader)"/>
<rect x="28" y="24" width="70.2" height="22" rx="11" fill="#0b3b66"/>
<text x="63.1" y="39" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">FIG 27.2</text>
<text x="110.2" y="41" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2540">Levels of autonomy for AI agents in network operations</text>
<text x="28" y="70" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5b6b7f">Each step to the right lets the agent do more alone — and raises the impact of a mistake</text>
<rect x="40.0" y="120.0" width="255.0" height="110.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="56.0" y="148.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="650" fill="#0f2540" text-anchor="start">Assist</text>
<text x="56.0" y="172.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">summarise, explain, spot trends</text>
<line x1="297.0" y1="175.0" x2="313.0" y2="175.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="315.0" y="120.0" width="255.0" height="110.0" rx="10" fill="#e7f0fc" stroke="#1d6fd1" stroke-width="2" filter="url(#shadow)"/>
<text x="331.0" y="148.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="650" fill="#0f2540" text-anchor="start">Recommend</text>
<text x="331.0" y="172.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">propose a fix; human approves</text>
<line x1="572.0" y1="175.0" x2="588.0" y2="175.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="590.0" y="120.0" width="255.0" height="110.0" rx="10" fill="#fdf1df" stroke="#d9861a" stroke-width="2" filter="url(#shadow)"/>
<text x="606.0" y="148.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="650" fill="#0f2540" text-anchor="start">Act within guardrails</text>
<text x="606.0" y="172.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">routine, reversible actions</text>
<line x1="847.0" y1="175.0" x2="863.0" y2="175.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="865.0" y="120.0" width="255.0" height="110.0" rx="10" fill="#fde8e8" stroke="#d64040" stroke-width="2" filter="url(#shadow)"/>
<text x="881.0" y="148.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="650" fill="#0f2540" text-anchor="start">Closed loop</text>
<text x="881.0" y="172.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6b7f" text-anchor="start">detect → fix → verify alone</text>
<line x1="60.0" y1="270.0" x2="1100.0" y2="270.0" stroke="#d9861a" stroke-width="6" stroke-linecap="round" marker-end="url(#m1)"/>
<text x="580.0" y="260.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#7a4708" text-anchor="middle">more autonomy → bigger impact of a mistake → more guardrails needed</text>
<line x1="60.0" y1="330.0" x2="1100.0" y2="330.0" stroke="#0f2540" stroke-width="1.5" stroke-linecap="round"/>
<rect x="165.3" y="318.8" width="269.5" height="22.5" rx="11.25" fill="#1f9d63" stroke="#1f9d63" stroke-width="1.2"/>
<text x="300.0" y="334.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">human IN the loop — approves each step</text>
<rect x="714.9" y="318.8" width="290.2" height="22.5" rx="11.25" fill="#7357d1" stroke="#7357d1" stroke-width="1.2"/>
<text x="860.0" y="334.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">human ON the loop — supervises, can stop it</text>
<line x1="28" y1="430" x2="1132" y2="430" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="452" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Match the level to the task: alert triage can act read-only; configuration changes stay at “recommend” with a person approving.</text>
<text x="1136" y="460" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
</svg>
