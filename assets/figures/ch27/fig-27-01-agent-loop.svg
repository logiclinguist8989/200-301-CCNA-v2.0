<text x="470.0" y="350.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#3e2a85" text-anchor="middle">LLM-based agent</text>
<text x="840.0" y="128.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2540" text-anchor="start">Tools</text>
<rect x="840.0" y="150.0" width="280.0" height="44.0" rx="8" fill="#e0f5f7" stroke="#0f9aa8" stroke-width="1.5"/>
<text x="858.0" y="178.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0b5b63" text-anchor="start">Read-only CLI / show</text>
<line x1="700.0" y1="300.0" x2="836.0" y2="172.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<rect x="840.0" y="206.0" width="280.0" height="44.0" rx="8" fill="#e0f5f7" stroke="#0f9aa8" stroke-width="1.5"/>
<text x="858.0" y="234.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0b5b63" text-anchor="start">Telemetry · SNMP · syslog</text>
<line x1="700.0" y1="300.0" x2="836.0" y2="228.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<rect x="840.0" y="262.0" width="280.0" height="44.0" rx="8" fill="#e7f0fc" stroke="#1d6fd1" stroke-width="1.5"/>
<text x="858.0" y="290.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f3f80" text-anchor="start">Ticketing (ITSM)</text>
<line x1="700.0" y1="300.0" x2="836.0" y2="284.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<rect x="840.0" y="318.0" width="280.0" height="44.0" rx="8" fill="#e4f6ec" stroke="#1f9d63" stroke-width="1.5"/>
<text x="858.0" y="346.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f5a37" text-anchor="start">Source of truth · Git</text>
<line x1="700.0" y1="300.0" x2="836.0" y2="340.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<rect x="840.0" y="374.0" width="280.0" height="44.0" rx="8" fill="#fdf1df" stroke="#d9861a" stroke-width="1.5"/>
<text x="858.0" y="402.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#7a4708" text-anchor="start">Automation (Ansible) — gated</text>
<line x1="700.0" y1="300.0" x2="836.0" y2="396.0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<rect x="40.0" y="476.0" width="1080.0" height="58.0" rx="10" fill="#fde8e8" stroke="#d64040" stroke-width="1.5"/>
<text x="60.0" y="501.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="800" fill="#8a1c1c" text-anchor="start">Guardrails</text>
<text x="60.0" y="522.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#0f2540" text-anchor="start">least privilege (read-only by default) · approval gates · dry runs · audit log · step / rate limits · treat tool output as data, not instructions</text>
<line x1="28" y1="581" x2="1132" y2="581" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="603" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Tools are the agent&#x27;s only way to see or touch the network (often published through the Model Context Protocol, MCP).</text>
<text x="28" y="622" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Generative AI answers once and a person acts; an agent acts itself — so the main risk is a wrong action at machine speed.</text>
<text x="1136" y="630" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
</svg>
