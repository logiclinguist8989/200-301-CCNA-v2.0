<text x="302.0" y="321.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f2540" text-anchor="start">Reload + confirm</text>
