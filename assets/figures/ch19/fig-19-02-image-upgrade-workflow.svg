<text x="278.0" y="368.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#5b6b7f" text-anchor="start">keep old image</text>
<line x1="28" y1="461" x2="1132" y2="461" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="483" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">No valid image at boot drops the device to ROMMON (rommon 1 &gt;) — always check show boot before reloading.</text>
<text x="28" y="502" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Install mode (Catalyst 9000): install add file flash:&lt;image&gt;.bin activate commit · Bundle mode: boot system flash:&lt;image&gt;.bin</text>
