<text x="618.0" y="168.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="500" fill="#5b6b7f" text-anchor="start">copy scp://… flash:</text>
