<text x="28" y="523" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">IOS XE: SCP server and client; SFTP client only. Both run inside SSH (TCP 22) and reuse Chapter 18 users and keys.</text>
<text x="28" y="542" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">SCP server needs: ip scp server enable · SSH · aaa authorization exec (privilege 15).</text>
