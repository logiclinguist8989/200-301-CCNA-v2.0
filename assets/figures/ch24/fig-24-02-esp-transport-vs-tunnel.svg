<path d="M340,254 L340,246 L900,246 L900,254" fill="none" stroke="#1d6fd1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="620.0" y="238.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1d6fd1" text-anchor="middle">encrypted</text>
