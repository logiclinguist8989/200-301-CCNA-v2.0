<text x="130.0" y="157.9" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f2540" text-anchor="middle">IP header</text>
<rect x="220.0" y="130.0" width="120.0" height="46.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="280.0" y="157.9" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f2540" text-anchor="middle">TCP</text>
