<text x="40.0" y="360.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2540" text-anchor="start">ESP tunnel mode — gateway to gateway (site-to-site, remote access); the default on Cisco routers</text>
