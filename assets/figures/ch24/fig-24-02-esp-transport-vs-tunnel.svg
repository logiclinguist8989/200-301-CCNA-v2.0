<rect x="910.0" y="392.0" width="110.0" height="46.0" rx="4" fill="#fdf1df" stroke="#d9861a" stroke-width="1.5"/>
<text x="965.0" y="419.9" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7a4708" text-anchor="middle">ESP auth</text>
<path d="M300,394 L300,386 L910,386 L910,394" fill="none" stroke="#1d6fd1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="605.0" y="378.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1d6fd1" text-anchor="middle">encrypted</text>
<path d="M190,436 L190,444 L910,444 L910,436" fill="none" stroke="#5b6b7f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="550.0" y="462.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#5b6b7f" text-anchor="middle">authenticated</text>
<text x="115.0" y="456.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d64040" text-anchor="middle">public IPs</text>
<line x1="28" y1="506" x2="1132" y2="506" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="528" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">The new IP header carries the gateways&#x27; public addresses, so private addresses cross the internet unseen.</text>
<text x="28" y="547" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">ESP is IP protocol 50. AH (protocol 51) authenticates but never encrypts and does not survive NAT.</text>
<text x="1136" y="555" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
