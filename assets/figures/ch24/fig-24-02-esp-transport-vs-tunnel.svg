<text x="115.0" y="419.9" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a1c1c" text-anchor="middle">New IP hdr</text>
