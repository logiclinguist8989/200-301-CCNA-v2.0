<text x="28" y="486" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">HQ and BR: default route to the ISP; crypto ACL 110 matches 172.16.1.0/24 ↔ 172.16.2.0/24 (BR mirrors it).</text>
<text x="28" y="505" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Without the tunnel the ISP drops 172.16.x packets; with it they travel inside ESP between 203.0.113.1 and .6.</text>
