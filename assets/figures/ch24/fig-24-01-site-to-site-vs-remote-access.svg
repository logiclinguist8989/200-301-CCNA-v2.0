<line x1="28" y1="584" x2="1132" y2="584" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="606" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Both protect confidentiality (AES), integrity (SHA-2 / GCM), authentication (PSK, certificates, user + MFA) and anti-replay.</text>
<text x="28" y="625" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Firewalls in the path must permit UDP 500, UDP 4500 (NAT-T) and ESP (IP 50) — plus TCP/UDP 443 for TLS remote access.</text>
