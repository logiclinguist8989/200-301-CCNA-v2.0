<text x="102.8" y="41" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2540">A duplex mismatch: link up/up, but each side logs different errors</text>
<text x="28" y="70" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5b6b7f">SW1 is hard-coded to 100/full; SW2 is on auto, senses 100 Mb/s and falls back to half duplex</text>
