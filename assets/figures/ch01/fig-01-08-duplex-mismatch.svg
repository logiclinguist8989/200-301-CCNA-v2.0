<g transform="translate(910.0,200.0) scale(1.2)"><ellipse cx="2" cy="18.5" rx="41.0" ry="6" fill="#0f2540" opacity="0.12"/><polygon points="-39.5,-6.5 -30.5,-15.5 39.5,-15.5 30.5,-6.5" fill="url(#gTop)" stroke="#0b4f8a" stroke-width="0.8"/><polygon points="30.5,-6.5 39.5,-15.5 39.5,6.5 30.5,15.5" fill="url(#gSide)"/><rect x="-39.5" y="-6.5" width="70" height="22" fill="url(#gFront)"/><line x1="-20.0" y1="-14.5" x2="-8.2" y2="-14.5" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/><polygon points="-4.0,-14.5 -8.2,-11.1 -8.2,-17.9" fill="#ffffff"/><line x1="4.0" y1="-14.5" x2="15.8" y2="-14.5" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/><polygon points="20.0,-14.5 15.8,-11.1 15.8,-17.9" fill="#ffffff"/><line x1="-4.0" y1="-7.5" x2="-15.8" y2="-7.5" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/><polygon points="-20.0,-7.5 -15.8,-10.9 -15.8,-4.1" fill="#ffffff"/><line x1="20.0" y1="-7.5" x2="8.2" y2="-7.5" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/><polygon points="4.0,-7.5 8.2,-10.9 8.2,-4.1" fill="#ffffff"/><rect x="-31.5" y="7.5" width="4.5" height="3.5" rx="0.8" fill="#9fe3b5" opacity="0.9"/><rect x="-24.5" y="7.5" width="4.5" height="3.5" rx="0.8" fill="#9fe3b5" opacity="0.9"/><rect x="-17.5" y="7.5" width="4.5" height="3.5" rx="0.8" fill="#9fe3b5" opacity="0.9"/><rect x="-10.5" y="7.5" width="4.5" height="3.5" rx="0.8" fill="#9fe3b5" opacity="0.9"/><rect x="-3.5" y="7.5" width="4.5" height="3.5" rx="0.8" fill="#9fe3b5" opacity="0.9"/><rect x="3.5" y="7.5" width="4.5" height="3.5" rx="0.8" fill="#9fe3b5" opacity="0.9"/><rect x="10.5" y="7.5" width="4.5" height="3.5" rx="0.8" fill="#9fe3b5" opacity="0.9"/><rect x="17.5" y="7.5" width="4.5" height="3.5" rx="0.8" fill="#9fe3b5" opacity="0.9"/></g>
<text x="910.0" y="265.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2540" text-anchor="middle">SW2</text>
<text x="910.0" y="282.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="middle">Gi0/1 — auto → 100 / HALF</text>
<line x1="305.0" y1="200.0" x2="855.0" y2="200.0" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
<rect x="330.2" y="190.7" width="41.5" height="15.4" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="351.0" y="203.3" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="500" fill="#5b6b7f" text-anchor="middle">Gi0/1</text>
<rect x="788.2" y="190.7" width="41.5" height="15.4" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="809.0" y="203.3" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="500" fill="#5b6b7f" text-anchor="middle">Gi0/1</text>
<rect x="478.3" y="190.7" width="203.4" height="15.4" rx="3" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="580.0" y="203.3" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">link up/up — pings may still succeed</text>
<rect x="337.3" y="128.8" width="485.5" height="22.5" rx="11.25" fill="#fdf1df" stroke="#d9861a" stroke-width="1.2"/>
<text x="580.0" y="144.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#7a4708" text-anchor="middle">Negotiation fails: SW2 cannot learn the duplex → default half (10/100 Mb/s)</text>
<rect x="60.0" y="300.0" width="420.0" height="150.0" rx="10" fill="#e7f0fc" stroke="#1d6fd1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="76.0" y="328.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="650" fill="#0f2540" text-anchor="start">Full-duplex side (SW1)</text>
<text x="76.0" y="350.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7f" text-anchor="start">Transmits whenever it likes, even while receiving</text>
<text x="76.0" y="369.4" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d64040" text-anchor="start" xml:space="preserve">CRC errors, runts, input errors  ↑</text>
<text x="76.0" y="388.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7f" text-anchor="start">because SW2 aborts frames mid-transmission</text>
<text x="76.0" y="407.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7f" text-anchor="start">when it detects a &#x27;collision&#x27;</text>
<rect x="680.0" y="300.0" width="420.0" height="150.0" rx="10" fill="#fde8e8" stroke="#d64040" stroke-width="2" filter="url(#shadow)"/>
<text x="696.0" y="328.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="650" fill="#0f2540" text-anchor="start">Half-duplex side (SW2)</text>
<text x="696.0" y="350.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7f" text-anchor="start">Listens first (CSMA/CD) and backs off</text>
<text x="696.0" y="369.4" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d64040" text-anchor="start" xml:space="preserve">Late collisions, collisions  ↑</text>
<text x="696.0" y="388.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7f" text-anchor="start">because SW1 talks over it after the first</text>
<text x="696.0" y="407.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7f" text-anchor="start">64 bytes — impossible on a healthy link</text>
<text x="580.0" y="380.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f2540" text-anchor="middle">Users notice:</text>
<text x="580.0" y="400.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6b7f" text-anchor="middle">slow, worse under load</text>
<line x1="28" y1="500" x2="1132" y2="500" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="522" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Always compare counters on BOTH ends. Fix: set both ends identically, or leave both on auto.</text>
<text x="1136" y="530" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
</svg>
