<text x="28" y="584" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">MMF: several paths of different lengths spread a pulse out (modal dispersion) → hundreds of metres.</text>
<text x="28" y="603" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">SMF: one path keeps the pulse sharp → kilometres. Each link uses two strands: Tx on one end to Rx on the other.</text>
