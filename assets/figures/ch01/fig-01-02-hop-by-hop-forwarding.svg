<text x="778.0" y="342.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#0f3f80" text-anchor="start">What changes, what stays</text>
<text x="778.0" y="362.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#0f3f80" text-anchor="start">• SW1 reads only the destination MAC and</text>
<text x="778.0" y="382.3" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#0f3f80" text-anchor="start" xml:space="preserve">  forwards the frame untouched.</text>
<text x="778.0" y="401.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#0f3f80" text-anchor="start">• R1 strips the old Ethernet header, routes</text>
<text x="778.0" y="421.3" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#0f3f80" text-anchor="start" xml:space="preserve">  on the IP destination and writes a new one.</text>
<text x="778.0" y="440.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#0f3f80" text-anchor="start">• Source and destination IP never change.</text>
