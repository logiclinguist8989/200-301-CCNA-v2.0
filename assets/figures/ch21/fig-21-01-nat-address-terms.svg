<text x="28" y="503" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Local = as seen on the inside · Global = as seen on the outside. Outside local = outside global unless outside</text>
<text x="28" y="522" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">addresses are also translated (not configured at CCNA level). NAT hides addressing but is not a security feature.</text>
