</defs>
<rect x="0.5" y="0.5" width="1099" height="828" rx="14" fill="#ffffff" stroke="#dbe3ec"/>
<rect x="0.5" y="0.5" width="1099" height="6" rx="3" fill="url(#gHeader)"/>
<rect x="28" y="24" width="62.8" height="22" rx="11" fill="#0b3b66"/>
<text x="59.4" y="39" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">FIG 5.5</text>
<text x="102.8" y="41" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2540">VLAN, trunk and gateway troubleshooting — work outward from the host</text>
<text x="28" y="70" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5b6b7f">Assumes the host&#x27;s IP settings are already correct (Figure 2.6)</text>
<rect x="60.0" y="106.0" width="380.0" height="64.0" rx="10" fill="#0b3b66" stroke="#0b3b66" stroke-width="1.5" filter="url(#shadow)"/>
<text x="76.0" y="132.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#ffffff" text-anchor="start">Host cannot reach its gateway or same-VLAN hosts</text>
<text x="76.0" y="153.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">Start at the host&#x27;s own access port</text>
<line x1="250.0" y1="170.0" x2="250.0" y2="200.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<polygon points="250.0,200.0 415.0,246 250.0,292.0 85.0,246" fill="#fdf1df" stroke="#d9861a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="250.0" y="250.7" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">Host port in the wrong VLAN?</text>
<line x1="415.0" y1="246.0" x2="524.0" y2="246.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="472.5" y="236.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d9861a" text-anchor="middle">yes</text>
<rect x="530.0" y="214.0" width="530.0" height="64.0" rx="10" fill="#e7f0fc" stroke="#1d6fd1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="546.0" y="248.9" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">show interfaces &lt;int&gt; switchport → switchport access vlan &lt;id&gt;</text>
<text x="262.0" y="310.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">no</text>
<line x1="250.0" y1="292.0" x2="250.0" y2="324.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<polygon points="250.0,324.0 415.0,370 250.0,416.0 85.0,370" fill="#fdf1df" stroke="#d9861a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="250.0" y="374.7" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">VLAN missing from the switch?</text>
<line x1="415.0" y1="370.0" x2="524.0" y2="370.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="472.5" y="360.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d9861a" text-anchor="middle">yes</text>
<rect x="530.0" y="338.0" width="530.0" height="64.0" rx="10" fill="#fdf1df" stroke="#d9861a" stroke-width="1.5" filter="url(#shadow)"/>
<text x="546.0" y="363.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">show vlan brief → create the VLAN (vlan &lt;id&gt;) on every switch that</text>
<text x="546.0" y="382.4" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">needs it</text>
<text x="262.0" y="434.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">no</text>
<line x1="250.0" y1="416.0" x2="250.0" y2="448.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<polygon points="250.0,448.0 415.0,494 250.0,540.0 85.0,494" fill="#fdf1df" stroke="#d9861a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="250.0" y="490.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">Trunk down, VLAN not allowed, or</text>
<text x="250.0" y="507.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">native mismatch?</text>
<line x1="415.0" y1="494.0" x2="524.0" y2="494.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="472.5" y="484.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d9861a" text-anchor="middle">yes</text>
<rect x="530.0" y="462.0" width="530.0" height="64.0" rx="10" fill="#efeafd" stroke="#7357d1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="546.0" y="487.5" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">show interfaces trunk → fix mode, allowed list, native VLAN on both</text>
<text x="546.0" y="506.4" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">ends</text>
<text x="262.0" y="558.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">no</text>
<line x1="250.0" y1="540.0" x2="250.0" y2="572.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<polygon points="250.0,572.0 415.0,618 250.0,664.0 85.0,618" fill="#fdf1df" stroke="#d9861a" stroke-width="1.8" filter="url(#shadow)"/>
<text x="250.0" y="614.2" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">Gateway SVI down, missing or wrong</text>
<text x="250.0" y="631.1" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4708" text-anchor="middle">IP?</text>
<line x1="415.0" y1="618.0" x2="524.0" y2="618.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<text x="472.5" y="608.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#d9861a" text-anchor="middle">yes</text>
<rect x="530.0" y="586.0" width="530.0" height="64.0" rx="10" fill="#fde8e8" stroke="#d64040" stroke-width="1.5" filter="url(#shadow)"/>
<text x="546.0" y="620.9" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0f2540" text-anchor="start">show ip interface brief → no shutdown, ip routing, correct address</text>
<text x="262.0" y="682.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6b7f" text-anchor="start">no</text>
<line x1="250.0" y1="664.0" x2="250.0" y2="682.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/>
<rect x="60.0" y="684.0" width="380.0" height="64.0" rx="10" fill="#e4f6ec" stroke="#1f9d63" stroke-width="2" filter="url(#shadow)"/>
<text x="76.0" y="710.8" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="650" fill="#0f2540" text-anchor="start">Layer 2 path is healthy</text>
<text x="76.0" y="731.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6b7f" text-anchor="start">Move on to routing (Chapter 10)</text>
<line x1="28" y1="789" x2="1072" y2="789" stroke="#e5eaf0" stroke-width="1"/>
<text x="28" y="811" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">Each check moves one hop further from the host: its port, the VLAN database, the trunks, then the gateway.</text>
<text x="1076" y="819" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#b6c2d0" text-anchor="end">CCNA 200-301 v2.0 Study Guide</text>
</svg>
