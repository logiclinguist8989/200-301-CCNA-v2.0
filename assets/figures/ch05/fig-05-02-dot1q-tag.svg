<text x="28" y="460" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#5b6b7f">PCP (CoS) 5 is used for voice in Chapter 7. VID 0 and 4095 are reserved; 1–4094 are usable.</text>
